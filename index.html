<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Notebook Kiyowo ✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- WELCOME SCREEN -->
<div id="welcomeScreen" class="center">
  <h1>✨ Welcome ✨</h1>
  <p>Notebook kiyowo kamu 💖</p>
  <button onclick="enterApp()">Masuk 💕</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="topbar">
    <h1>📓 Notebook</h1>
    <button onclick="toggleMode()">🌙</button>
  </div>

  <div class="container">
    <textarea id="noteInput" placeholder="Tulis pikiran kamu... 💭"></textarea>
    <br>
    <button onclick="addNote()">Tambah ✨</button>
  </div>

  <div id="notesContainer"></div>

</div>

<script src="script.js"></script>
</body>
</html>
